[workspace]
resolver = "2"
members = [
    "crates/arbiter-core",
    "crates/arbiter-alloc",
    "crates/arbiter-store",
    "crates/arbiter-proto",
    "crates/arbiter-net",
    "crates/arbiter-probe",
    "crates/arbiter-iso",
    "crates/arbiter-storage",
    "crates/arbiter-telemetry",
    "crates/arbiter-master",
    "crates/arbiter-agent",
    "crates/arbiter-executor",
    "crates/arbiter-sdk",
    "crates/arbiter-tui",
    "bins/arbiter",
    "bins/arbiter-master",
    "bins/arbiter-agent",
    "bins/arbiter-executor",
    "bins/arbiter-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/SamuelMarks/arbiter-rs"
authors = ["Samuel Marks <samuel@offscale.io>"]
keywords = ["scheduler", "orchestrator", "mesos", "gpu", "tpu"]
categories = ["concurrency", "network-programming", "os"]

[workspace.dependencies]
arbiter-core = { path = "crates/arbiter-core", version = "0.1" }
arbiter-alloc = { path = "crates/arbiter-alloc", version = "0.1" }
arbiter-store = { path = "crates/arbiter-store", version = "0.1" }
arbiter-proto = { path = "crates/arbiter-proto", version = "0.1" }
arbiter-net = { path = "crates/arbiter-net", version = "0.1" }
arbiter-probe = { path = "crates/arbiter-probe", version = "0.1" }
arbiter-iso = { path = "crates/arbiter-iso", version = "0.1" }
arbiter-storage = { path = "crates/arbiter-storage", version = "0.1" }
arbiter-telemetry = { path = "crates/arbiter-telemetry", version = "0.1" }
arbiter-master = { path = "crates/arbiter-master", version = "0.1" }
arbiter-agent = { path = "crates/arbiter-agent", version = "0.1" }
arbiter-executor = { path = "crates/arbiter-executor", version = "0.1" }
arbiter-tui = { path = "crates/arbiter-tui", version = "0.1" }
arbiter-master-bin = { path = "bins/arbiter-master", version = "0.1" }
arbiter-agent-bin = { path = "bins/arbiter-agent", version = "0.1" }
arbiter-executor-bin = { path = "bins/arbiter-executor", version = "0.1" }
arbiter-cli = { path = "bins/arbiter-cli", version = "0.1" }

derive_more = { version = "2.1", default-features = false, features = ["display", "error", "from"] }
serde = { version = "1.0", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
rkyv = { version = "0.8", default-features = false, features = ["alloc", "bytecheck"] }
sha2 = { version = "0.11", default-features = false }
proptest = { version = "1.12", default-features = false, features = ["std"] }

rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-pki-types = { version = "1.15", default-features = false }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
http = { version = "1.5", default-features = false }
h2 = { version = "0.4", default-features = false }
hmac = { version = "0.13", default-features = false }
base16ct = { version = "1.0", default-features = false, features = ["alloc"] }
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
tokio = { version = "1.54", default-features = false, features = ["rt", "net", "time", "sync"] }
tokio-tungstenite = { version = "0.30", default-features = false }
prost = { version = "0.14", default-features = false, features = ["derive"] }
tonic = { version = "0.14", default-features = false }
ed25519-dalek = { version = "3.0", default-features = false }
p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
x509-cert = { version = "0.3", default-features = false }
der = { version = "0.8", default-features = false }
ring = { version = "0.17", default-features = false }
crc32fast = { version = "1.5", default-features = false }
tokio-postgres = { version = "0.7", default-features = false }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
zstd = { version = "0.14", default-features = false }
tar = { version = "0.4", default-features = false }
zip = { version = "9.1", default-features = false, features = ["deflate-flate2"] }
lzma-rs = { version = "0.3", default-features = false }
chacha20poly1305 = { version = "0.11", default-features = false }
rusqlite = { version = "0.41", default-features = false, features = ["bundled"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", default-features = false, features = ["events"] }
libloading = { version = "0.9", default-features = false }
nix = { version = "0.31", default-features = false, features = ["term"] }
clap = { version = "4.6", default-features = false, features = ["std"] }
petgraph = { version = "0.8", default-features = false }
redb = { version = "4.4", default-features = false }
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
oci-spec = { version = "0.10", default-features = false, features = ["runtime"] }
prometheus-client = { version = "0.25", default-features = false }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
nvml-wrapper = { version = "0.13", default-features = false }
object_store = { version = "0.14", default-features = false }
cedar-policy = { version = "4.14", default-features = false }
spiffe = { version = "0.18", default-features = false }
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
openraft = { version = "0.9", default-features = false }
aes-gcm = { version = "0.11", default-features = false, features = ["aes"] }
zeroize = { version = "1.9", default-features = false, features = ["derive"] }
sha1 = { version = "0.11", default-features = false }
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto"] }
axum = { version = "0.8", default-features = false }
tower = { version = "0.5", default-features = false, features = ["util"] }
lru = { version = "0.19", default-features = false }
uuid = { version = "1.29", default-features = false }

[workspace.lints.rust]
missing_docs = "forbid"
unsafe_code = "forbid"

[workspace.lints.rustdoc]
broken_intra_doc_links = "forbid"
private_intra_doc_links = "forbid"
bare_urls = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
missing_docs_in_private_items = "forbid"
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
todo = "forbid"
unimplemented = "forbid"
unreachable = "forbid"
indexing_slicing = "forbid"
float_arithmetic = "deny"
multiple_crate_versions = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_const_for_fn = "allow"
assert_is_empty = "allow"
decimal_bitwise_operands = "allow"
needless_bitwise_bool = "allow"
map_unwrap_or = "allow"
unnecessary_semicolon = "allow"
manual_div_ceil = "allow"
unnecessary_sort_by = "allow"
unnecessary_option_map_or_else = "allow"
cloned_ref_to_slice_refs = "allow"
manual_assert_eq = "allow"
or_fun_call = "allow"
manual_is_variant_and = "allow"
format_push_string = "allow"
